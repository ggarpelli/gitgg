<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src _CSP_SOURCE_ 'unsafe-inline'; script-src 'nonce-_NONCE_';">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diff Summary</title>

    <link rel="stylesheet" href="_WEBVIEW_CSS_URI_">

</head>
<body>
    <script id="json-data" type="application/json">_VSCODE_WEBVIEW_DATA_</script>

    <div id="summary-container">
    <div class="summary-line">
            <svg viewBox="0 0 16 16" version="1.1" xmlns="http://www.w3.org/2000/svg"><path d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75Zm0 5A.75.75 0 0 1 1.75 12h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 12.75Z"></path></svg>
            <span id="summary-title"></span>
        </div>
        <div class="summary-line">
            <svg viewBox="0 0 16 16" version="1.1" xmlns="http://www.w3.org/2000/svg"><path d="M12.28 7.22a.75.75 0 0 0 0-1.06l-2.25-2.25a.75.75 0 0 0-1.06 1.06L10.44 6H2.75a.75.75 0 0 0 0 1.5h7.69l-1.47 1.47a.75.75 0 1 0 1.06 1.06l2.25-2.25zM4.78 8.72a.75.75 0 0 0 0 1.06l2.25 2.25a.75.75 0 1 0 1.06-1.06L6.62 10h7.63a.75.75 0 0 0 0-1.5H6.62l1.47-1.47a.75.75 0 1 0-1.06-1.06l-2.25 2.25z"></path></svg>
            <span id="summary-branches"></span>
        </div>
        <div class="summary-line" id="global-actions">
        </div>
    </div>
    <div id="context-note" role="note" hidden></div>

    <div id="toolbar">
        <input id="search" type="search" placeholder="Search files by name or path (Ctrl+F)..." title="Filter the list by file name or folder, e.g. AccountService or lwc/payment. Esc clears it." autocomplete="off" spellcheck="false">
        <select id="status-filter" title="Filter files by change status" aria-label="Filter by change status">
            <option value="all">All changes</option>
            <option value="added">Added</option>
            <option value="changed">Changed</option>
            <option value="deleted">Deleted</option>
        </select>
        <span id="search-count"></span>
    </div>
    <div id="busy-banner" role="status" aria-live="polite" hidden></div>
    <div id="result-banner" role="status" aria-live="polite" hidden></div>

    <div id="diff-container"></div>

    <script nonce="_NONCE_" src="_WEBVIEW_JS_URI_"></script>
</body>
</html>
